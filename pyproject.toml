[project]
name = "cwe-prompting"
version = "0.1.0"
description = "CWE abstraction prompting experiment with functional and static analysis"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "bandit>=1.8.6",
    "fastparquet>=2026.5.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "openai>=2.45.0",
    "pandas>=3.0.3",
    "pyarrow>=20.0.0",
    "scipy>=1.16.0",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
]
